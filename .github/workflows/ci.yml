name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cka
          POSTGRES_PASSWORD: cka
          POSTGRES_DB: cka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cka -d cka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cka:cka@localhost:5432/cka
      ENVIRONMENT: test
      OTEL_TRACES_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src tests scripts

      - name: Enable pgvector extension
        run: |
          docker exec $(docker ps -q --filter "ancestor=pgvector/pgvector:pg16") \
            psql -U cka -d cka -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Unit tests (no external services required)
        run: uv run pytest tests/unit -q

      - name: Integration, security & observability tests
        run: >
          uv run pytest tests/integration tests/security tests/observability
          --cov=src/cka --cov-report=term-missing --cov-fail-under=80
