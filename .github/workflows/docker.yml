name: Docker

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-scan-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t corporate-knowledge-assistant-api:ci .

      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: corporate-knowledge-assistant-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Generate SBOM (Syft)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft corporate-knowledge-assistant-api:ci \
            -o table

      - name: Upload SBOM artifact
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/out \
            anchore/syft corporate-knowledge-assistant-api:ci \
            -o spdx-json=/out/sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
