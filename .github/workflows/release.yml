name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      # Every quality gate re-run at release time, not trusted from an
      # earlier CI run — matches ADR-012/ADR-015's "no release without every
      # gate green, checked at release time" rule.
      - name: Lint, type check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src tests scripts

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/corporate-knowledge-assistant
          docker build -t "$IMAGE:${{ github.ref_name }}" -t "$IMAGE:latest" .

      - name: Push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/corporate-knowledge-assistant
          docker push "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:latest"
