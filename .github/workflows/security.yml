name: Security

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history to scan commits

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Dependency audit (pip-audit)
        run: uv tool run pip-audit --local

      - name: SAST (Semgrep)
        run: uv tool run semgrep --config auto --error src/

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_BASELINE_PATH: .gitleaks-baseline.json
